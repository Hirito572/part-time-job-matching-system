
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: part-time-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DEBUG: "True"
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: part-time-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
